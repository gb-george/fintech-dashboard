<section class="page">
  <h1>Settings</h1>

  <form>
    <label>
      Instrument count
      <input type="number" name="instrumentCount" value="5" min="1" max="50" />
    </label>

    <label>
      Updates per batch
      <input type="number" name="updatesPerBatch" value="100" min="1" max="1000" />
    </label>

    <label>
      Batch interval (ms)
      <input type="number" name="batchIntervalMs" value="500" min="50" max="2000" />
    </label>

    <button type="button">Apply</button>
  </form>
</section>
